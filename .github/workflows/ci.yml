name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Validate OpenAPI contract
        run: |
          expected_operations=$(mktemp)
          actual_operations=$(mktemp)
          cat >"$expected_operations" <<'EOF'
          DELETE /v1/devices/{id}
          DELETE /v1/user
          DELETE /v1/user/avatar
          GET /health
          GET /ready
          GET /v1/attestation
          GET /v1/attestation/pubkey
          GET /v1/audit
          GET /v1/auth/challenge
          GET /v1/auth/confirm-email-change
          GET /v1/auth/verify-email
          GET /v1/devices
          GET /v1/user
          GET /v1/vault
          GET /v1/vault/history
          GET /v1/vault/history/{version}
          POST /v1/auth/confirm-email-change
          POST /v1/auth/forgot-password
          POST /v1/auth/login
          POST /v1/auth/logout
          POST /v1/auth/logout-all
          POST /v1/auth/refresh
          POST /v1/auth/register
          POST /v1/auth/reset-password
          POST /v1/auth/verify-email
          POST /v1/devices
          PUT /v1/user
          PUT /v1/user/avatar
          PUT /v1/user/password
          PUT /v1/vault
          EOF
          awk '/^  \/[^:]*:$/ { path=$1; sub(/:$/, "", path) }
               /^    (get|post|put|delete|patch):$/ { method=toupper($1); sub(/:$/, "", method); print method, path }' \
            api/openapi.yaml | sort >"$actual_operations"
          sort -o "$expected_operations" "$expected_operations"
          diff -u "$expected_operations" "$actual_operations"
          go run github.com/getkin/kin-openapi/cmd/validate@v0.149.0 api/openapi.yaml
      - name: Check formatting
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: Validate workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: sshvault
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sshvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sshvault -d sshvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sshvault:ci-only-password@localhost:5432/sshvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Verify PostgreSQL client tools
        run: |
          pg_dump --version
          psql --version
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1'
      # Argon2 tests allocate 256 MiB per call; bound package and test parallelism.
      - name: Unit and PostgreSQL integration tests with race detection
        run: go test -v -race -p 1 -parallel 2 -count=1 -timeout=15m ./...

  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -p 1 -parallel 2 -count=1 -timeout=15m ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o dist/ ./cmd/server ./cmd/cli

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker build -f docker/Dockerfile -t sshvault-server:ci .
      - name: Scan runtime image and generate SBOM
        run: |
          mkdir -p "$RUNNER_TEMP/image-audit"
          docker save -o "$RUNNER_TEMP/image-audit/image.tar" sshvault-server:ci
          scanner=aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          docker run --rm -v "$RUNNER_TEMP/image-audit:/input:ro" "$scanner" \
            image --input /input/image.tar --format cyclonedx > "$RUNNER_TEMP/runtime-sbom.cdx.json"
          docker run --rm -v "$RUNNER_TEMP/image-audit:/input:ro" "$scanner" \
            image --input /input/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
      - name: Upload runtime SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-sbom
          path: ${{ runner.temp }}/runtime-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate Compose configuration and PostgreSQL pin
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci-only-password docker compose -f docker/docker-compose.yml config --quiet
          grep -Eq 'image: postgres:16-alpine@sha256:[a-f0-9]{64}$' docker/docker-compose.yml
      - name: Smoke test Compose database connectivity
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: |
          trap 'docker compose -f docker/docker-compose.yml down --volumes' EXIT
          docker compose -f docker/docker-compose.yml up --detach --build postgres server
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker/docker-compose.yml logs server postgres
          exit 1
      - name: Check runtime permissions and backup tools
        run: |
          docker run --rm --entrypoint sh sshvault-server:ci -ec '
            test "$(id -u)" != 0
            test -w /app/backups
            test -w /app/keys
            test -w /app/logs
            pg_dump --version
            gzip --version
          '

  required:
    name: CI
    if: always()
    needs: [lint, test, windows, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
